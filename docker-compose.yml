version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: e-store-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e_store

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d e_store']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - e-store-network

  redis:
    image: redis:8
    container_name: e-store-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - e-store-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: e-store-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@estore.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - '5050:80'

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - e-store-network

networks:
  e-store-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

  pgadmin_data:
    driver: local
